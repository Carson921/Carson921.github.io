        location: Mountain View, California
        start_date: 2026-05
        end_date: 2026-08
        highlights:
          - Red-teamed agentic browsers, developed attack proofs of concept, and proposed mitigation patches.
          - Built agent-harness components including graph-based memory with conflict resolution and incremental updates, on-device prerequisite distillation, and evaluation data for a Monitor API.
          - Designed a scalable agent-security benchmark with stepwise annotations and trajectory-level evaluation, then used the evaluation structure to train a detector-based defense.

      - company: University of Georgia
        position: Graduate Research Assistant
        location: Athens, Georgia
        start_date: 2024-08
        end_date: Present
        highlights:
          - Conducted a systematic security analysis of agentic browsers across commercial and open-source systems, identifying prompt-injection attacks involving hidden content, iframes, and forms.
          - Proposed FragFuse, a black-box attack that fragments prohibited intent across interactions and reconstructs it through long-term memory retrieval.
          - Proposed MetaBreak, a systematic jailbreak method that uses LLM special tokens to attack online chatbot and API services.

      - company: University of Science and Technology of China
        position: Graduate Student
        location: Anhui, China
        start_date: 2022-09
        end_date: 2024-06
        highlights:
          - Built an automated framework using symbolic execution, data-flow analysis, and cryptographic reasoning to detect machine-learning model leakage in mobile applications.
          - Formalized and verified a privacy-preserving single sign-on protocol and adapted it to browser-only deployment with PKCE.

      - company: ByteDance
        position: Software Engineer Intern
        location: Beijing, China
        start_date: 2022-05
        end_date: 2022-07
        highlights:
          - Designed authentication logic for Lark Task, added rich-text support, and developed Open Platform APIs and permission controls.

